<body>
  <header class="top">진주시 탄소중립 <b>남강 Green Map</b></header>
  <main>
    <div class="intro-row">
      <div><div class="eyebrow">ENVIRONMENTAL AWARENESS CALENDAR</div><h1 class="title" tabindex="-1">환경 기념일 캘린더</h1></div>
    </div>
    <section class="calendar" aria-label="환경 기념일 및 실천 일정 달력">
      <div class="calendar-layout">
        <div class="calendar-main">
          <div class="cal-top"><div class="cal-month"><button class="icon-btn" id="prev" type="button" aria-label="이전 달"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h2 id="month-label" aria-live="polite"></h2><button class="icon-btn" id="next" type="button" aria-label="다음 달"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div><button class="cal-today" id="today" type="button">오늘</button></div>
          <div class="week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div class="days" id="days" role="group" aria-label="월별 달력"></div>
        </div>
        <section class="detail-card" id="environment-detail" aria-live="polite" aria-label="선택한 날짜의 환경 기념일"></section>
      </div>
    </section>
    <a class="back" href="../index.html">← GREEN MAP으로 돌아가기</a>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded",()=>document.querySelector(".title")?.focus({preventScroll:true}),{once:true});
    (()=>{
      const now=()=>new Date();let current=now();let year=current.getFullYear(),month=current.getMonth();
      const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      let selected=dateKey(current),environmentDays=[];
      const grid=document.querySelector('#days'),label=document.querySelector('#month-label'),detail=document.querySelector('#environment-detail');
      const safe=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
      function occasionDate(event,eventYear){if(event.dateMode==='annual-rule'){const annual=event.annualDates?.[String(eventYear)];if(annual){const [m,d]=annual.split('-').map(Number);return new Date(eventYear,m-1,d)}if(event.id==='earth-hour'){const last=new Date(eventYear,3,0);const shift=last.getDay()===6?0:last.getDay()+1;return new Date(eventYear,2,last.getDate()-shift)}}if(event.date){const [m,d]=event.date.split('-').map(Number);return new Date(eventYear,m-1,d)}return null}
      function occasionsAt(key){const [y,m,d]=key.split('-').map(Number);return environmentDays.filter(event=>{const date=occasionDate(event,y);return date&&date.getMonth()+1===m&&date.getDate()===d})}
      function renderMedia(event){const wrap=safe('div','occasion-media'),frame=safe('div','occasion-media-frame'),media=event.media;if(media&&media.src){if(media.type==='video'){const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';if(media.poster)video.poster=media.poster;const source=document.createElement('source');source.src=media.src;if(media.mimeType)source.type=media.mimeType;video.append(source);frame.append(video)}else{const image=document.createElement('img');image.src=media.src;image.alt=media.alt||event.nameKo;image.loading='lazy';image.decoding='async';frame.append(image)}}else{frame.classList.add('is-empty');const placeholder=safe('div','occasion-media-empty');placeholder.append(safe('span','','PHOTO / VIDEO'),safe('p','','기념일 사진이나 영상을 표시할 공간입니다.'));frame.append(placeholder)}wrap.append(frame);if(media?.caption)wrap.append(safe('p','occasion-media-caption',media.caption));return wrap}
      function renderDetail(){detail.replaceChildren();const occasions=occasionsAt(selected),[yy,mm,dd]=selected.split('-').map(Number);if(!occasions.length){detail.hidden=true;detail.closest('.calendar-layout').classList.add('has-no-detail');return}detail.hidden=false;detail.closest('.calendar-layout').classList.remove('has-no-detail');detail.classList.remove('empty-detail');detail.append(safe('div','detail-kicker','ENVIRONMENTAL DAY'));detail.append(safe('p','detail-date',`${yy}년 ${mm}월 ${dd}일 · ${occasions.length}개 기념일`));occasions.forEach(event=>{const article=safe('article','occasion');article.append(safe('h3','detail-title',event.nameKo),safe('p','detail-en',event.nameEn),safe('p','detail-meaning',event.meaning),safe('p','detail-impact',event.impact));if(event.dateRule){const dateNote=event.dateRule+(event.dateMode==='annual-rule'&&!event.annualDates?.[String(yy)]?' · 연도별 일정 확인':'');article.append(safe('span','detail-rule',dateNote))}const meta=safe('div','event-tags');meta.append(safe('span','event-tag',event.category),safe('span','event-type',event.classification));article.append(meta);article.append(renderMedia(event));if(event.sourceUrl){const sources=safe('div','sources'),link=safe('a','source-link','참고 출처');link.href=event.sourceUrl;link.target='_blank';link.rel='noopener noreferrer';link.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg','svg'),{innerHTML:'<path d="M14 3h7v7M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'}));sources.append(link);if(event.verificationStatus==='확인 필요')sources.append(safe('small','review-note','명칭 또는 날짜의 공식성은 추가 확인이 필요합니다.'));article.append(sources)}detail.append(article)})}
      function render(){
        current=now();
        label.textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long'}).format(new Date(year,month,1));
        grid.replaceChildren();
        const offset=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate(),previousCount=new Date(year,month,0).getDate();
        for(let i=0;i<42;i++){
          let day,cellMonth=month,cellYear=year;
          if(i<offset){day=previousCount-offset+i+1;if(--cellMonth<0){cellMonth=11;cellYear--}}
          else if(i>=offset+count){day=i-offset-count+1;if(++cellMonth>11){cellMonth=0;cellYear++}}
          else day=i-offset+1;
          const date=new Date(cellYear,cellMonth,day),key=dateKey(date),button=safe('button','day');
          button.type='button';
          if(cellMonth!==month)button.classList.add('other');
          if(key===selected)button.classList.add('selected');
          if(key===dateKey(current)){button.classList.add('today');button.setAttribute('aria-current','date')}
          const celebrations=occasionsAt(key);
          button.append(safe('span','day-number',day));
          if(celebrations.length){button.classList.add('has-events');button.append(safe('i','day-dot'));celebrations.forEach(event=>{const caption=safe('span','day-event-name',event.nameKo);caption.title=event.nameKo;button.append(caption)})}
          button.tabIndex=key===selected?0:-1;
          button.setAttribute('aria-pressed',key===selected?'true':'false');
          const names=celebrations.map(event=>event.nameKo).join(', ');
          const dateLabel=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(date);
          button.setAttribute('aria-label',names?dateLabel+', '+names:dateLabel);
          button.onclick=()=>selectDate(key,cellYear,cellMonth);
          grid.append(button);
        }
        renderDetail();
      }
      function selectDate(key,cellYear,cellMonth){selected=key;if(cellMonth!==undefined){month=cellMonth;year=cellYear}render()}
      const swipeArea=document.querySelector('.calendar-main'),swipeViewport=document.querySelector('.calendar-layout');
      let touchStart=null,dragging=false,swipeAnimating=false,suppressCalendarClickUntil=0;
      function clearSwipeStyles(){swipeArea.style.transform='';swipeArea.style.opacity='';swipeArea.classList.remove('is-dragging');swipeViewport.classList.remove('is-swiping')}
      function returnCalendarToPlace(offset){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){clearSwipeStyles();return}swipeAnimating=true;const animation=swipeArea.animate([{transform:`translate3d(${offset}px,0,0)`,opacity:.8},{transform:'translate3d(0,0,0)',opacity:1}],{duration:230,easing:'cubic-bezier(.22,1,.36,1)'});animation.onfinish=()=>{clearSwipeStyles();swipeAnimating=false}}
      async function swipeMonth(direction,offset){if(swipeAnimating)return;swipeAnimating=true;swipeArea.classList.remove('is-dragging');if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){clearSwipeStyles();moveMonth(direction);swipeAnimating=false;return}const edge=direction>0?-1:1,distance=Math.min(190,Math.max(90,swipeArea.clientWidth*.38)),outX=edge*distance;const exit=swipeArea.animate([{transform:`translate3d(${offset}px,0,0)`,opacity:1},{transform:`translate3d(${outX}px,0,0)`,opacity:.16}],{duration:190,easing:'cubic-bezier(.4,0,.2,1)'});await exit.finished;moveMonth(direction);const inX=-outX;swipeArea.style.transform=`translate3d(${inX}px,0,0)`;swipeArea.style.opacity='.16';const enter=swipeArea.animate([{transform:`translate3d(${inX}px,0,0)`,opacity:.16},{transform:'translate3d(0,0,0)',opacity:1}],{duration:350,easing:'cubic-bezier(.22,1,.36,1)'});await enter.finished;clearSwipeStyles();swipeAnimating=false}
      swipeArea.addEventListener('touchstart',event=>{if(swipeAnimating||event.touches.length!==1)return;const touch=event.touches[0];touchStart={x:touch.clientX,y:touch.clientY,time:performance.now()};dragging=false},{passive:true});
      swipeArea.addEventListener('touchmove',event=>{if(!touchStart||swipeAnimating)return;const touch=event.touches[0],dx=touch.clientX-touchStart.x,dy=touch.clientY-touchStart.y;if(!dragging){if(Math.abs(dx)<9)return;if(Math.abs(dx)<=Math.abs(dy)){touchStart=null;return}dragging=true;swipeArea.classList.add('is-dragging');swipeViewport.classList.add('is-swiping')}event.preventDefault();swipeArea.style.transform=`translate3d(${dx}px,0,0)`;swipeArea.style.opacity=String(Math.max(.48,1-Math.abs(dx)/900))},{passive:false});
      function finishCalendarTouch(event){if(!touchStart)return;const touch=event.changedTouches[0]||{clientX:touchStart.x},dx=touch.clientX-touchStart.x,elapsed=Math.max(1,performance.now()-touchStart.time),velocity=dx/elapsed,wasDragging=dragging;touchStart=null;dragging=false;if(!wasDragging)return;suppressCalendarClickUntil=Date.now()+450;const advance=Math.abs(dx)>54||Math.abs(velocity)>.38;if(advance)swipeMonth(dx<0?1:-1,dx);else returnCalendarToPlace(dx);}
      swipeArea.addEventListener('touchend',finishCalendarTouch,{passive:true});swipeArea.addEventListener('touchcancel',finishCalendarTouch,{passive:true});
      grid.addEventListener('click',event=>{if(Date.now()<suppressCalendarClickUntil){event.preventDefault();event.stopPropagation()}},true);
      function moveMonth(amount){const next=new Date(year,month+amount,1);year=next.getFullYear();month=next.getMonth();const day=Math.min(Number(selected.slice(-2)),new Date(year,month+1,0).getDate());selected=dateKey(new Date(year,month,day));render()}
      document.querySelector('#prev').onclick=()=>moveMonth(-1);document.querySelector('#next').onclick=()=>moveMonth(1);document.querySelector('#today').onclick=()=>{current=now();year=current.getFullYear();month=current.getMonth();selected=dateKey(current);render()};
      grid.addEventListener('keydown',event=>{const delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[event.key];if(delta){event.preventDefault();const date=new Date(`${selected}T12:00:00`);date.setDate(date.getDate()+delta);const key=dateKey(date);selectDate(key,date.getFullYear(),date.getMonth());grid.querySelector('.selected')?.focus()}});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){const fresh=now();if(dateKey(fresh)!==dateKey(current)){current=fresh;render()}}});
      fetch('../data/environment-days.json').then(response=>{if(!response.ok)throw new Error('Calendar data unavailable');return response.json()}).then(data=>{environmentDays=data;render()}).catch(()=>{environmentDays=[];render()});render();
    })();
  </script>
