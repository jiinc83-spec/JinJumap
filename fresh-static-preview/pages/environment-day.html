m button{padding:0 11px}}
</style><style>@keyframes page-enter{from{opacity:0;transform:translate3d(0,18px,0) scale(.99)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}body{animation:page-enter .72s cubic-bezier(.16,1,.3,1) both}.top-info a{transition:color .32s ease,transform .32s cubic-bezier(.16,1,.3,1)}.top-info a:hover{transform:translateY(-2px)}.top-info a:active{transform:scale(.97)}@media(prefers-reduced-motion:reduce){body{animation:none}.top-info a{transition:none}}</style><style>

#tumbler-cards .card:nth-child(5n) .card-art{background:var(--theme-green)}
.section-links a,.card,.tumbler-entry,.actions,.feature-empty,.calendar,.panel{border-color:#e8eee6}
.action-icon.mint{background:var(--theme-mint)}.action-icon.blue{background:var(--theme-blue)}.action-icon.yellow{background:var(--theme-sage)}.action-icon.rose{background:#e4f1e7}
.day.selected{background:var(--theme-sage);border-color:#dce8d8}.dot{background:var(--theme-green-deep)}
</style><style>
/* Calm, image-led editorial treatment inspired by boutique travel layouts */
.top{box-shadow:none;border-bottom:1px solid #edf0eb}.brand-mark{display:grid;place-items:center;background:#eff5e9;color:#55765a}.brand-mark svg{width:22px;height:22px}
.top-info{padding-top:12px;padding-bottom:3px}.top-info a{background:#f7f9f5;border-color:transparent;border-radius:999px;box-shadow:none;color:#59715b;letter-spacing:.01em}.top-info a:hover{background:#eaf3e9;border-color:#dfeade;box-shadow:0 5px 16px #3b5b3710;color:#385b3c}
.hero{min-height:335px;border-radius:24px;background:linear-gradient(112deg,#eff5e9 0%,#d9efdf 63%,#c9e7ed 125%)}.hero-copy{padding:48px 46px}.hero h1{font-size:clamp(36px,4.2vw,50px);line-height:1.28;letter-spacing:-2px;margin:16px 0}.hero p:not(.eyebrow){max-width:430px;font-size:14px;line-height:1.95;color:#687b6b}.hero-art{width:440px}.nature-graphic{height:280px}.nature-graphic .leaf-line{fill:#e6f0e5;stroke:#78977c;stroke-width:1.25}.nature-graphic .vein,.nature-graphic .wave{stroke:#7f9e85;stroke-width:1.25}.nature-graphic .wave:nth-of-type(3){stroke:#9ab7b0}
main{max-width:1200px}.category-section{margin-bottom:54px}.category-heading h2{font-size:25px;letter-spacing:-.8px}.category-heading p{color:#879587}.category-number{border-radius:50%;font-size:11px}.tumbler-entry,.feature-empty{border-radius:18px;box-shadow:0 7px 26px #263d1008}.tumbler-entry{padding:22px 24px}.feature-empty{border-style:solid;padding:25px}.feature-empty .feature-visual{border-radius:18px}.card{border-radius:13px;box-shadow:0 5px 18px #263d1008}.brand-card .card-art{border-bottom:0}.brand-card .card-body{padding:13px 14px 14px}.brand-benefit{border-radius:10px}.category-section.bicycle .card-art{border:0;border-radius:13px 13px 0 0}.section-head h2{letter-spacing:-.8px}
@media(max-width:850px){.hero{min-height:300px}.hero-copy{padding:36px 30px}.hero-art{width:340px}}
@media(max-width:640px){.hero{min-height:240px;border-radius:18px}.hero-copy{padding:25px 20px}.hero h1{font-size:27px;letter-spacing:-1px}.hero p:not(.eyebrow){font-size:10px}.hero-art{width:220px}.category-section{margin-bottom:36px}.category-heading h2{font-size:19px}.tumbler-entry{padding:14px}}
</style><style>main{max-width:960px}</style></head>
<body>
  <header class="top">남강 <b>GREEN MAP</b></header>
  <main>
    <div class="eyebrow">CARBON &amp; ENVIRONMENT</div>
    <h1 class="title">탄소환경의 날</h1>
    <p class="lead">기후와 환경을 생각하는 날, 일상 속 작은 실천 일정을 기록해 보세요.</p>
    <section class="calendar" aria-label="실천 일정 캘린더">
      <div class="cal-top"><div class="cal-month"><button class="cal-btn" id="prev" aria-label="이전 달">‹</button><h2 id="month-label"></h2><button class="cal-btn" id="next" aria-label="다음 달">›</button></div><button class="cal-today" id="today">오늘</button></div>
      <div class="week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="days" id="days"></div>
      <section class="agenda"><h3 id="selected-date"></h3><form class="event-form" id="event-form"><input id="event-input" maxlength="60" placeholder="환경 실천 일정을 입력하세요" aria-label="환경 실천 일정"><button type="submit">일정 추가</button></form><ul class="event-list" id="event-list"></ul></section>
    </section>
    <section class="panel"><h2>오늘부터 할 수 있는 실천</h2><p>개인 컵 사용하기, 가까운 거리는 걷거나 자전거 이용하기, 재활용품을 깨끗하게 분리배출하기처럼 생활 속 행동이 탄소를 줄이는 데 도움이 됩니다.</p><div class="actions"><div>개인 컵으로 음료 주문하기</div><div>가까운 거리는 자전거 타기</div><div>재활용품 분리배출하기</div></div></section>
    <a class="back" href="../index.html">← GREEN MAP으로 돌아가기</a>
  </main>
  <script>
    (()=>{
      const storageKey='jinju-carbon-calendar-v1';let events={};
      try{events=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
      const today=new Date();let year=today.getFullYear(),month=today.getMonth();
      const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      let selected=dateKey(today);
      const grid=document.querySelector('#days'),label=document.querySelector('#month-label'),selectedLabel=document.querySelector('#selected-date'),list=document.querySelector('#event-list');
      function render(){
        label.textContent=`${year}년 ${month+1}월`;grid.replaceChildren();
        const offset=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate(),previousCount=new Date(year,month,0).getDate();
        for(let i=0;i<42;i++){
          let day,cellMonth=month,cellYear=year;
          if(i<offset){day=previousCount-offset+i+1;if(--cellMonth<0){cellMonth=11;cellYear--}}
          else if(i>=offset+count){day=i-offset-count+1;if(++cellMonth>11){cellMonth=0;cellYear++}}
          else day=i-offset+1;
          const date=new Date(cellYear,cellMonth,day),key=dateKey(date),button=document.createElement('button');
          button.type='button';button.className='day';if(cellMonth!==month)button.classList.add('other');if(key===selected)button.classList.add('selected');if(key===dateKey(today))button.classList.add('today');
          const number=document.createElement('span');number.className='day-number';number.textContent=day;button.append(number);
          if(events[key]?.length){const dot=document.createElement('i');dot.className='dot';button.append(dot)}
          button.setAttribute('aria-label',`${cellYear}년 ${cellMonth+1}월 ${day}일${events[key]?.length?' 일정 있음':''}`);
          button.onclick=()=>{selected=key;if(cellMonth!==month||cellYear!==year){month=cellMonth;year=cellYear}render()};grid.append(button)
        }
        const [yy,mm,dd]=selected.split('-').map(Number);selectedLabel.textContent=`${mm}월 ${dd}일 실천 일정`;list.replaceChildren();
        const todaysEvents=events[selected]||[];
        if(!todaysEvents.length){const empty=document.createElement('li');empty.className='empty';empty.textContent='등록된 일정이 없습니다.';list.append(empty)}
        todaysEvents.forEach((text,index)=>{const li=document.createElement('li'),content=document.createElement('span'),remove=document.createElement('button');content.textContent=text;remove.type='button';remove.className='delete-event';remove.textContent='×';remove.setAttribute('aria-label',`${text} 일정 삭제`);remove.onclick=()=>{events[selected].splice(index,1);if(!events[selected].length)delete events[selected];save();render()};li.append(content,remove);list.append(li)})
      }
      function save(){localStorage.setItem(storageKey,JSON.stringify(events))}
      function moveMonth(amount){const next=new Date(year,month+amount,1);year=next.getFullYear();month=next.getMonth();const day=Math.min(Number(selected.slice(-2)),new Date(year,month+1,0).getDate());selected=dateKey(new Date(year,month,day));render()}
      document.querySelector('#prev').onclick=()=>moveMonth(-1);document.querySelector('#next').onclick=()=>moveMonth(1);
      document.querySelector('#today').onclick=()=>{year=today.getFullYear();month=today.getMonth();selected=dateKey(today);render()};
      document.querySelector('#event-form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#event-input'),value=input.value.trim();if(!value)return;(events[selected]||=[]).push(value);save();input.value='';render()};render()
    })();
  </script>
</body></html>
