name: Deploy GREEN MAP to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Prepare static preview
        run: |
          mkdir -p dist
          cp fresh-static-preview/index.html dist/index.html
          cp fresh-static-preview/mobile.html dist/mobile.html
          cp fresh-static-preview/mobile.css dist/mobile.css
          cp fresh-static-preview/mobile-bottom-nav.css dist/mobile-bottom-nav.css
          cp fresh-static-preview/mobile-bottom-nav.js dist/mobile-bottom-nav.js
          cp fresh-static-preview/mobile-map.js dist/mobile-map.js
          cp fresh-static-preview/map-place-details.js dist/map-place-details.js
          cp fresh-static-preview/hero-carousel.css dist/hero-carousel.css
          cp fresh-static-preview/hero-carousel.js dist/hero-carousel.js
          cp fresh-static-preview/mobile-preview.html dist/mobile-preview.html
          cp -R fresh-static-preview/pages fresh-static-preview/assets fresh-static-preview/data dist/
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('dist/kakao-config.js', 'window.KAKAO_MAP_APP_KEY = ' + JSON.stringify(process.env.KAKAO_MAP_APP_KEY || '') + ';');"
        env:
          KAKAO_MAP_APP_KEY: ${{ vars.KAKAO_MAP_APP_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
