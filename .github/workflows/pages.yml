name: Deploy GREEN MAP to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Prepare static preview
        run: |
          mkdir -p dist
          cp fresh-static-preview/index.html dist/index.html
          cp -R fresh-static-preview/pages fresh-static-preview/assets dist/
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('dist/kakao-config.js', 'window.KAKAO_MAP_APP_KEY = ' + JSON.stringify(process.env.KAKAO_MAP_APP_KEY || '') + ';');"
        env:
          KAKAO_MAP_APP_KEY: ${{ vars.KAKAO_MAP_APP_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
